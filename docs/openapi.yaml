openapi: 3.0.3
info:
  title: Baso Kang Gito API
  version: 0.3.0
  description: >-
    Single-shop notebook. Financial endpoints require a unique approved installation bearer credential.
    HTTPS is mandatory for remote deployment; loopback HTTP is development-only.
    Business dates use Asia/Jakarta; system audit timestamps are UTC. All monetary values
    and sync cursors are decimal strings. Platform amounts are net after fees.
    Optional createdAt values are immutable server creation timestamps for presentation,
    separate from business dates and commit-order sync cursors. Offline clients may use
    provisional local timestamps until first synchronization, so presentation order may change then.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API and PostgreSQL readiness
      description: Read-only connectivity check. Does not certify migration state. No authentication. Responses are not cached. Retry 503 with backoff.
      responses:
        '200':
          description: PostgreSQL accepted a query.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
              example: { status: ok }
        '503':
          description: PostgreSQL is unavailable; no internal connection details are exposed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [unavailable]
              example: { status: unavailable }
  /v1/operations:
    post:
      operationId: applyFinancialOperation
      summary: Create/correct a sale or shopping entry, record a receipt, or void a mistake
      security: [{deviceToken: []}]
      description: >-
        The operation UUID, financial mutation, audit snapshot, response and cursor commit atomically.
        Retry the identical body/ID after a lost response; never generate another ID for a retry.
        Reuse with different content returns 409. expectedVersion=0 creates; edits/receipts/voids
        require the current root version and a nonempty reason. Conflicts never use last-write-wins.
        One sale root includes its receipts; adding/voiding a receipt increments that root version.
        save_sale creates an individual direct sale or one platform daily aggregate. paid=true
        explicitly records money received and requires receiptId/method; platform defaults unpaid
        in the client. Editing never changes receipts: omit paid/receiptId/method. Reducing below
        allocations is rejected. Void the mistaken receipt explicitly, then record a correction.
        Voiding a paid sale requires includeReceipts=true and reverses those receipts too.
        save_customer creates/updates a customer (name required; phone/address/notes optional), with
        expectedVersion and reason on edits. archived prevents new links; existing debts remain payable.
        Customer mutations use the same atomic operation/audit/change stream and return a Customer snapshot.
        New clients always send customerId (UUID or null) for save_sale. Direct unpaid/part-paid creates
        require an active customer UUID. Omission remains supported solely for unchanged Milestone 1 outboxes.
        paid=true accepts optional paymentAmount for an initial partial receipt (default full amount).
        paymentAmount must be omitted on edits or paid=false. Customer links are direct-sale only.
        Customer UUIDs are checked against authoritative records. A new link captures the supplied customer
        name at entry (or the current master name if omitted), so offline sales retain their name even if
        the master is renamed before upload. Unchanged links retain their existing historical names.
        Archived customers can receive payments. No name-based historical linking or automatic merging occurs.
        Event deposits, refunds, POS writes and multi-sale settlement entry are not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Operation'}
            examples:
              paidSale:
                value:
                  id: 6f09c139-9077-40ca-9e82-9f9dce3d4e48
                  recordId: c261405d-a9db-4fbb-90d9-31d924e60ebc
                  expectedVersion: 0
                  action: save_sale
                  data: {date: '2026-10-26', channel: langsung, amount: '25000', paid: true, receiptId: 'b79950a4-4019-4c36-9e5b-40bb2dc66f39', method: cash}
              platformSale:
                value:
                  id: 915952d3-53a2-4b42-b8cc-c406b264c30f
                  recordId: d719052e-ae6d-42f0-aa29-f53c9da02c21
                  expectedVersion: 0
                  action: save_sale
                  data: {date: '2026-10-26', channel: gofood, amount: '200000', paid: false}
              customer:
                value:
                  id: 97e357d6-4fa1-4ff8-92e1-275328b94c7a
                  recordId: 7eb46042-e91e-4abd-bc8d-e19a5336bd1f
                  expectedVersion: 0
                  action: save_customer
                  data: {name: Ibu Sari, phone: '08123456789'}
              partialBon:
                value:
                  id: fcb8736a-7333-4ca4-a729-a2481b61e0e2
                  recordId: 294f691c-ccbd-4869-a54a-d0b43d9686bc
                  expectedVersion: 0
                  action: save_sale
                  data: {date: '2026-10-26', channel: langsung, amount: '100000', customerId: '7eb46042-e91e-4abd-bc8d-e19a5336bd1f', paid: true, paymentAmount: '40000', receiptId: 'd67244e2-cfb7-424a-b13c-42ab9f80e8aa', method: cash}
      responses:
        '200':
          description: Committed result, or the stored result of the identical operation. An upload cursor is not a download checkpoint.
          content:
            application/json:
              schema:
                type: object
                required: [record, cursor]
                properties:
                  record: {$ref: '#/components/schemas/Snapshot'}
                  cursor: {type: string, pattern: '^[0-9]+$'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '500': {$ref: '#/components/responses/Retryable'}
  /v1/changes:
    get:
      operationId: downloadChanges
      summary: Pull immutable full record snapshots in server commit order
      security: [{deviceToken: []}]
      description: >-
        Start after=0. Persist snapshots and returned cursor in one local transaction.
        Follow hasMore until false. Ignore older root versions, preserve local pending writes,
        and retain tombstones. The stream is retained in full in Milestone 1; no cursor expiry.
        Legacy snapshots are enriched with root/receipt createdAt values at read time without
        changing their historical amounts, versions, dates or the stored operation replay result.
      parameters:
        - {name: after, in: query, schema: {type: string, default: '0', pattern: '^[0-9]+$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: Ordered change page; cursor may stay unchanged for an empty page.
          content:
            application/json:
              schema:
                type: object
                required: [changes, cursor, hasMore]
                properties:
                  cursor: {type: string}
                  hasMore: {type: boolean}
                  changes:
                    type: array
                    items:
                      type: object
                      required: [cursor, record]
                      properties:
                        cursor: {type: string}
                        record: {$ref: '#/components/schemas/Snapshot'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/customers:
    get:
      operationId: listCustomers
      summary: Search customers by literal name or phone substring with exact outstanding balances
      security: [{deviceToken: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: archived, in: query, description: Include archived customers, schema: {type: boolean, default: false}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: UUID-ordered page. Balance excludes voids and platform settlements; next is null at the end.
          content:
            application/json:
              schema:
                type: object
                required: [customers, next]
                properties:
                  next: {type: string, format: uuid, nullable: true}
                  customers:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/Customer'}
                        - {type: object, required: [outstanding], properties: {outstanding: {type: string, pattern: '^[0-9]+$'}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/customers/{id}:
    get:
      operationId: getCustomerHistory
      summary: Customer details, whole-customer balance and paged related sale/payment history
      security: [{deviceToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: History includes voided sales and receipts for review. Balance covers all pages and excludes voids.
          content:
            application/json:
              schema:
                type: object
                required: [customer, outstanding, records, next]
                properties:
                  customer: {$ref: '#/components/schemas/Customer'}
                  outstanding: {type: string, pattern: '^[0-9]+$'}
                  next: {type: string, format: uuid, nullable: true}
                  records: {type: array, items: {$ref: '#/components/schemas/Record'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
        '404': {$ref: '#/components/responses/Invalid'}
  /v1/records/{id}:
    get:
      operationId: getFinancialRecord
      security: [{deviceToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current full sale/receipt or expense/item snapshot, including voids.
          content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
        '404': {$ref: '#/components/responses/Invalid'}
  /v1/daily:
    get:
      operationId: getDailyNotebook
      security: [{deviceToken: []}]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200':
          description: Matching roots (including receipts on this date), exact full-day totals, and nullable next UUID. Voided roots remain inspectable but do not contribute to totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: {type: string, format: date}
                  totals: {$ref: '#/components/schemas/Totals'}
                  next: {type: string, nullable: true}
                  records: {type: array, items: {$ref: '#/components/schemas/Record'}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/monthly:
    get:
      operationId: getMonthlyRecap
      security: [{deviceToken: []}]
      parameters:
        - {name: month, in: query, required: true, schema: {type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$'}}
      responses:
        '200':
          description: Exact month totals, channel totals and daily sales/receipt/expense sums; cashDifference is receipts minus spending, not profit or cash balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: {type: string}
                  totals: {$ref: '#/components/schemas/Totals'}
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: {type: string, format: date}
                        sales: {type: string}
                        received: {type: string}
                        expenses: {type: string}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/bootstrap:
    post:
      operationId: bootstrapAdministrator
      summary: Consume an operator-issued one-time token for this installation
      description: >-
        Provide a locally generated UUID and 32 random bytes as Bearer UUID.base64urlSecret.
        Persist proof before sending. CLI token expires in ten minutes; only its hash is stored.
        Atomic single use; identical proof can retry within expiry. After a lost response use /me
        with the persisted proof even after expiry. New first administrators cannot self-elect.
        Five attempts per IP per minute and thirty globally. Recovery token issuance requires operator database authority.
      security: [{deviceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, token]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200': {description: 'Active administrator identity. Response contains id, role=admin, state=active; no secret is returned.'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/enrollments:
    post:
      operationId: requestDeviceEnrollment
      summary: Request approval for a specific installation proof
      description: >-
        Proof is not yet trusted. Generate and persist UUID plus 32 random bytes before initiation.
        Returns id, six-digit code, state. Exact id/proof/name/purpose replay returns the same request.
        Different proof or metadata under the same ID returns 409. Ten-minute expiry; five initiations
        per IP per minute and thirty globally. Matching a name/code never grants trust by itself.
      security: [{deviceToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                purpose: {type: string, enum: [device, pin_recovery], default: device}
      responses:
        '200': {$ref: '#/components/responses/EnrollmentStatus'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/enrollment/status:
    post:
      operationId: checkDeviceEnrollment
      summary: Read only the enrollment bound to the supplied installation proof
      description: Thirty polls per installation per minute. No business access or provisioning occurs here.
      security: [{deviceToken: []}]
      responses:
        '200': {$ref: '#/components/responses/EnrollmentStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/enrollment/complete:
    post:
      operationId: completeDeviceEnrollment
      summary: Activate approved proof, confirming local credential persistence
      description: >-
        The installation already possesses its secret. Approval alone grants no financial access.
        Completion atomically creates one standard device using its verifier. Identical proof retries
        return the same identity, including after request expiry if already active. Revoked proof stays denied.
      security: [{deviceToken: []}]
      responses:
        '200': {description: 'Active standard identity; id, role=standard, state=active.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/me:
    get:
      operationId: verifyDeviceAccess
      summary: Verify current installation identity and recover interrupted provisioning
      security: [{deviceToken: []}]
      responses:
        '200':
          description: Active installation identity
          content:
            application/json:
              schema:
                type: object
                required: [id, name, role]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  role: {type: string, enum: [admin, standard]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/devices:
    get:
      operationId: listDeviceAccess
      summary: Administrator-only trusted devices and unexpired pending requests
      description: >-
        devices contains id, name, role, createdAt, revokedAt (nullable).
        pending contains id, name, purpose, createdAt, expiresAt, state, attempts.
        No credential verifiers, secrets or pairing codes are disclosed.
        All access routes share a 120-request/IP/minute limit; credential verification also has a 600/IP/minute limit.
      security: [{deviceToken: []}]
      responses:
        '200': {description: 'Object containing devices and pending arrays.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/enrollments/{id}/decision:
    post:
      operationId: decideDeviceEnrollment
      summary: Administrator approves a verified installation or rejects it
      description: >-
        Verify name, full installation ID and code directly with the owner. Code comparison is constant-time.
        Five incorrect codes permanently reject this request. Approval/rejection is atomic and single use.
        Standard/pending devices cannot approve; self-approval is rejected. Code required only for approval.
      security: [{deviceToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: {type: boolean}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200': {description: 'Decision committed; ok=true.'}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AccessLimited'}
  /v1/access/devices/{id}/revoke:
    post:
      operationId: revokeDeviceAccess
      summary: Administrator revokes device authorization
      description: >-
        Serialized with enrollment/administrator changes. Last active administrator cannot be revoked.
        Cancels outstanding approvals issued by the revoked administrator. Every subsequent authentication
        check rejects revoked proof; requests authorized before revocation may finish. Financial rows and
        local outboxes are preserved. Offline devices cannot discover revocation until communicating.
      security: [{deviceToken: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Revocation committed, including identical retries; ok=true.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/AccessForbidden'}
        '404': {$ref: '#/components/responses/Invalid'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/AccessLimited'}
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: >-
        Installation UUID, a dot, and a 256-bit base64url secret. Only active trusted devices may
        access financial routes; administrators manage devices. Server stores SHA-256 verifiers.
        No shared development-token fallback. Enrollment endpoints accept provisional proof only.
  responses:
    AccessForbidden:
      description: 'access_revoked or administrator_required. Stop financial sync on access_revoked; preserve local money, drafts and pending operations.'
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    AccessLimited:
      description: Too many attempts. Retry after sixty seconds without changing operation IDs.
      headers:
        Retry-After: {schema: {type: string}, description: '60'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    EnrollmentStatus:
      description: Enrollment identity, human pairing reference and server-controlled state
      content:
        application/json:
          schema:
            type: object
            required: [id, code, state]
            properties:
              id: {type: string, format: uuid}
              code: {type: string, pattern: '^[0-9]{6}$'}
              state: {type: string, enum: [pending, approved, rejected, active, expired]}
    Invalid:
      description: Invalid input, missing record, or financial constraint. Do not retry unchanged; preserve the local operation for review.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Missing/invalid installation credential. Stop synchronization and preserve pending operations. Reenrollment requires administrator approval.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Stale version, aggregate already exists, reused operation ID or duplicate identifier. current is supplied for version/aggregate conflicts when available. Review before replacing a local draft.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Retryable:
      description: Unexpected server failure. Retry the identical operation ID/body with backoff; a prior commit may have succeeded.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Amount: {type: string, pattern: '^[1-9][0-9]{0,11}$', description: 'Positive whole rupiah, at most 999999999999 per sale/item/receipt. Totals may be larger.'}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        current: {$ref: '#/components/schemas/Snapshot'}
    Snapshot:
      oneOf:
        - {$ref: '#/components/schemas/Record'}
        - {$ref: '#/components/schemas/Customer'}
      discriminator:
        propertyName: kind
        mapping:
          sale: '#/components/schemas/Record'
          expense: '#/components/schemas/Record'
          customer: '#/components/schemas/Customer'
    Customer:
      type: object
      required: [id, kind, name, phone, address, notes, archived, version, createdAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [customer]}
        name: {type: string, minLength: 1, maxLength: 200}
        phone: {type: string, maxLength: 50}
        address: {type: string, maxLength: 500}
        notes: {type: string, maxLength: 1000}
        archived: {type: boolean}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    Operation:
      type: object
      required: [id, recordId, expectedVersion, action, data]
      properties:
        id: {type: string, format: uuid}
        recordId: {type: string, format: uuid}
        expectedVersion: {type: integer, minimum: 0, maximum: 2147483646}
        action: {type: string, enum: [save_sale, save_expense, add_receipt, void, save_customer]}
        data:
          type: object
          description: save_sale needs date/channel/amount and paid for creates; paid creates need receiptId/method and may supply paymentAmount. Current clients always send customerId (nullable); new direct Bon requires an active UUID. save_customer needs name with optional phone/address/notes/archived. save_expense needs date/items (1–100). add_receipt needs id/date/amount/method. Corrections need reason (1–500 chars). void optionally targets receiptId or explicitly includes linked receipts. Items have stable UUIDs.
          properties:
            date: {type: string, format: date}
            channel: {type: string, enum: [langsung, gofood, grabfood, shopeefood]}
            amount: {$ref: '#/components/schemas/Amount'}
            customer: {type: string, maxLength: 200}
            customerId: {type: string, format: uuid, nullable: true}
            paymentAmount: {$ref: '#/components/schemas/Amount'}
            name: {type: string, minLength: 1, maxLength: 200}
            phone: {type: string, maxLength: 50}
            address: {type: string, maxLength: 500}
            notes: {type: string, maxLength: 1000}
            archived: {type: boolean}
            note: {type: string, maxLength: 1000}
            paid: {type: boolean}
            id: {type: string, format: uuid}
            receiptId: {type: string, format: uuid}
            method: {type: string, enum: [cash, transfer]}
            reason: {type: string, minLength: 1, maxLength: 500}
            includeReceipts: {type: boolean}
            items:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required: [id, name, amount]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string, minLength: 1, maxLength: 200}
                  amount: {$ref: '#/components/schemas/Amount'}
    Record:
      type: object
      required: [id, kind, date, version, amount, note, voided]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [sale, expense]}
        date: {type: string, format: date}
        version: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time, description: 'Immutable server creation time in UTC for display ordering. Optional for compatibility with old operation replay results; never a business date or synchronization cursor.'}
        amount: {type: string, pattern: '^[0-9]+$'}
        note: {type: string}
        voided: {type: boolean}
        channel: {type: string, enum: [langsung, gofood, grabfood, shopeefood]}
        origin: {type: string, enum: [manual, pos]}
        entryKind: {type: string, enum: [individual, daily_aggregate]}
        customer: {type: string}
        customerId: {type: string, format: uuid, nullable: true, description: Stable explicit Master Customer link. Missing on legacy snapshots; customer remains the historical name snapshot.}
        items:
          type: array
          items: {type: object, required: [id, name, amount], properties: {id: {type: string, format: uuid}, name: {type: string}, amount: {type: string}}}
        receipts:
          type: array
          items:
            type: object
            required: [id, date, amount, method, voided]
            properties:
              id: {type: string, format: uuid}
              date: {type: string, format: date}
              amount: {type: string}
              createdAt: {type: string, format: date-time, description: 'Immutable server receipt creation time in UTC, independent of its received date.'}
              method: {type: string, enum: [cash, transfer]}
              voided: {type: boolean}
    Totals:
      type: object
      required: [sales, received, expenses, cashDifference, byChannel]
      properties:
        sales: {type: string}
        received: {type: string}
        expenses: {type: string}
        cashDifference: {type: string, description: Dated receipts minus paid shopping; not profit or a cash balance.}
        byChannel:
          type: array
          items: {type: object, properties: {channel: {type: string}, amount: {type: string}}}
