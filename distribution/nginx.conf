map $uri $release_cache {
    default "no-cache";
    /version.json "no-store";
    /latest.apk "no-store";
    ~^/releases/baso-kang-gito-v[0-9.]+-[0-9]+\.apk$ "public, max-age=31536000, immutable";
}
map $status $response_cache {
    default "no-store";
    200 $release_cache;
    206 $release_cache;
    302 "no-store";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    add_header Cache-Control $response_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = /version.json { proxy_pass http://api:3000/v1/app-version; proxy_hide_header Cache-Control; }
    location = /latest.apk { proxy_pass http://api:3000/v1/app-download; proxy_hide_header Cache-Control; }
    location ~ ^/releases/baso-kang-gito-v[0-9.]+-[0-9]+\.apk$ {
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
    }
    location /releases/ { return 404; }
    location = /privacy {
        default_type text/html;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
