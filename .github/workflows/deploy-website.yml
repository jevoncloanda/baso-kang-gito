name: Deploy Download Website

on:
  push:
    branches: [main]
    paths:
      - "distribution/**"
      - "backend/scripts/publish-cloudra.py"
      - "backend/scripts/deploy-website.sh"
      - "backend/scripts/verify-website.py"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baso-kang-gito-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release generations and website publishing
        run: python3 backend/test/publish-cloudra.test.py -q
      - name: Check deployment script and JavaScript syntax
        run: |
          bash -n backend/scripts/deploy-website.sh
          node --input-type=module --check < distribution/site.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish and verify website generation
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf -v remote_cmd 'bash -se -- %q %q' "$VPS_DEPLOY_PATH" "$DEPLOY_SHA"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" "$remote_cmd" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin main
          git switch main
          git merge --ff-only "$2"
          # Refuse to deploy a newer checkout under an older workflow invocation.
          test "$(git rev-parse HEAD)" = "$2"
          bash backend/scripts/deploy-website.sh
          git rev-parse HEAD
          REMOTE
